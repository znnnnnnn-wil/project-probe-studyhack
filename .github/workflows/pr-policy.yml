name: PR review policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  review-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check change size and linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.issue.number
            });
            const lines = pr.additions + pr.deletions;
            if (lines > 500) {
              core.setFailed(`PR has ${lines} changed lines; maximum is 500 (additions + deletions).`);
              return;
            }
            const matches = [...(pr.body || '').matchAll(/^Closes\s+#(\d+)\s*$/gm)];
            if (matches.length !== 1) {
              core.setFailed('Add exactly one standalone line: Closes #<issue number>.');
              return;
            }
            const issue_number = Number(matches[0][1]);
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.pull_request) {
              core.setFailed('The linked item must be an issue, not another pull request.');
              return;
            }
            core.notice(`Checked ${lines}/500 changed lines and linked issue #${issue_number}.`);
